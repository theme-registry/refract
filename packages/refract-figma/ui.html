<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body { font: 12px/1.5 "Inter", system-ui, sans-serif; margin: 0; padding: 16px; }
      h1 { font-size: 13px; margin: 0 0 4px; }
      p.sub { margin: 0 0 12px; opacity: 0.7; }
      label { display: block; font-weight: 600; margin: 10px 0 4px; }
      input, textarea { width: 100%; font-family: ui-monospace, monospace; font-size: 11px;
        border: 1px solid rgba(128,128,128,0.4); border-radius: 6px; padding: 7px 8px; background: transparent; color: inherit; }
      textarea { height: 220px; resize: vertical; }
      .row { display: flex; gap: 8px; }
      .row > div { flex: 1; }
      button { margin-top: 12px; width: 100%; padding: 9px; border: 0; border-radius: 6px;
        background: #4c6ef5; color: #fff; font-weight: 600; cursor: pointer; }
      button:hover { background: #3b5bdb; }
      #out { margin-top: 12px; font-family: ui-monospace, monospace; font-size: 11px; white-space: pre-wrap; }
      .ok { color: #2b8a3e; } .err { color: #e03131; } .warn { opacity: 0.75; }
    </style>
  </head>
  <body>
    <h1>refract → Figma variables</h1>
    <p class="sub">Paste a DTCG <code>tokens.json</code> (from <code>refract tokens</code>). For multi-mode, paste <code>{ "modes": [{ "name": "dark", "doc": … }] }</code>.</p>
    <div class="row">
      <div><label for="collection">Collection</label><input id="collection" value="refract" /></div>
      <div><label for="mode">Mode (single-doc)</label><input id="mode" value="default" /></div>
    </div>
    <label for="doc">DTCG document</label>
    <textarea id="doc" placeholder='{ "color": { "$type": "color", "brand": { "base": { "$value": "#4c6ef5" } } } }'></textarea>
    <button id="create">Create variables</button>
    <div id="out"></div>

    <script>
      const $ = (id) => document.getElementById(id);
      const out = $("out");

      $("create").onclick = () => {
        out.textContent = "";
        let parsed;
        try {
          parsed = JSON.parse($("doc").value);
        } catch (e) {
          out.innerHTML = '<span class="err">Invalid JSON: ' + e.message + "</span>";
          return;
        }
        // Either a { modes: [{name, doc}] } set, or a single DTCG document → one named mode.
        const modes = Array.isArray(parsed.modes)
          ? parsed.modes
          : [{ name: $("mode").value || "default", doc: parsed }];
        parent.postMessage({ pluginMessage: { type: "create", collection: $("collection").value, modes } }, "*");
      };

      onmessage = (event) => {
        const msg = event.data.pluginMessage;
        if (!msg) return;
        if (msg.type === "done") {
          let html = '<span class="ok">✓ Created ' + msg.created + " variable(s) across " + msg.modes.length + " mode(s): " + msg.modes.join(", ") + "</span>";
          if (msg.warnings && msg.warnings.length) {
            html += '\n<span class="warn">' + msg.warnings.length + " skipped:\n  " + msg.warnings.join("\n  ") + "</span>";
          }
          out.innerHTML = html;
        } else if (msg.type === "error") {
          out.innerHTML = '<span class="err">✗ ' + msg.message + "</span>";
        }
      };
    </script>
  </body>
</html>
